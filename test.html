<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="Remini Image Enhancer">
<title>Remini Enhancer</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
min-height:100%;
background:#0b0b0f;
color:#f5f5f5;
font-family:Arial,sans-serif
}

body{
padding:14px 11px
}

.wrap{
width:100%;
max-width:500px;
margin:auto
}

.card{
background:#121218;
border:1px solid #25252e;
border-radius:18px;
padding:17px;
box-shadow:0 8px 30px rgba(0,0,0,.3)
}

.head{
text-align:center;
margin-bottom:17px
}

.logo{
width:58px;
height:58px;
margin:auto;
border-radius:17px;
background:linear-gradient(135deg,#ff3158,#ff719b);
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
font-weight:bold
}

h1{
font-size:22px;
margin-top:10px
}

.sub{
font-size:12px;
color:#888;
margin-top:5px
}

.drop{
display:block;
padding:25px 12px;
border:1px dashed #3a3a45;
border-radius:15px;
background:#0f0f14;
text-align:center;
cursor:pointer
}

.drop:active{
transform:scale(.99)
}

.drop-icon{
font-size:31px;
margin-bottom:7px
}

.drop b{
font-size:14px
}

.drop p{
font-size:11px;
color:#777;
margin-top:6px
}

input{
display:none
}

.preview{
display:none;
margin-top:13px;
overflow:hidden;
border:1px solid #292933;
border-radius:14px;
background:#0d0d12
}

.preview img{
display:block;
width:100%;
max-height:330px;
object-fit:contain
}

.info{
padding:9px;
font-size:11px;
color:#999;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:0;
border-radius:12px;
font-size:14px;
font-weight:bold;
cursor:pointer
}

.main{
background:#ff4169;
color:#fff
}

.main:disabled{
opacity:.45;
cursor:not-allowed
}

.dark{
background:#24242d;
color:#fff
}

.status{
display:none;
margin-top:13px;
padding:11px;
border-radius:11px;
font-size:12px;
line-height:1.5
}

.status.show{
display:block
}

.status.ok{
background:#14251c;
border:1px solid #285339;
color:#a8e6bd
}

.status.err{
background:#28151a;
border:1px solid #542833;
color:#ff9baa
}

.loading{
display:none;
padding:14px 0;
text-align:center;
font-size:12px;
color:#aaa
}

.loading.show{
display:block
}

.spinner{
display:inline-block;
width:15px;
height:15px;
margin-right:6px;
border:2px solid #555;
border-top-color:#ff4169;
border-radius:50%;
vertical-align:-4px;
animation:spin .7s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

.result{
display:none;
margin-top:18px
}

.result-title{
font-size:15px;
font-weight:bold;
margin-bottom:9px
}

.result img{
display:block;
width:100%;
border-radius:14px;
border:1px solid #292933;
background:#08080b
}

.save{
display:none;
background:#24242d;
color:#fff
}

.footer{
text-align:center;
margin-top:14px;
font-size:10px;
color:#555
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="head">
<div class="logo">R</div>
<h1>Remini Enhancer</h1>
<div class="sub">Pilih foto lalu tingkatkan kualitasnya.</div>
</div>

<label class="drop" id="drop">

<div class="drop-icon">＋</div>

<b>Pilih Foto</b>

<p>
JPG, JPEG atau PNG • maksimal 10 MB
</p>

<input
id="file"
type="file"
accept="image/jpeg,image/jpg,image/png"
>

</label>

<div class="preview" id="preview">

<img
id="previewImg"
alt="Preview foto"
>

<div
class="info"
id="fileInfo"
></div>

</div>

<button
id="process"
class="main"
disabled
>
✨ Tingkatkan Foto
</button>

<div
id="loading"
class="loading"
>
<span class="spinner"></span>
<span id="loadingText">Menyiapkan...</span>
</div>

<div
id="status"
class="status"
></div>

<div
id="result"
class="result"
>

<div class="result-title">
Hasil Remini
</div>

<img
id="resultImg"
alt="Hasil Remini"
>

<button
id="save"
class="save"
>
⬇ Simpan Hasil
</button>

<button
id="reset"
class="dark"
>
Pilih Foto Lain
</button>

</div>

<div class="footer">
Remini Enhancer
</div>

</div>

</div>

<script>

const API_KEY=
"gBw4bfj5haqY";

const UPLOAD_API=
"https://uguu.se/upload";

const REMINI_API=
"https://api.alyachan.dev/api/tools/blurbg";

const fileInput=
document.getElementById("file");

const drop=
document.getElementById("drop");

const preview=
document.getElementById("preview");

const previewImg=
document.getElementById("previewImg");

const fileInfo=
document.getElementById("fileInfo");

const processBtn=
document.getElementById("process");

const loading=
document.getElementById("loading");

const loadingText=
document.getElementById("loadingText");

const statusBox=
document.getElementById("status");

const result=
document.getElementById("result");

const resultImg=
document.getElementById("resultImg");

const saveBtn=
document.getElementById("save");

const resetBtn=
document.getElementById("reset");

let selectedFile=null;

let resultUrl="";


drop.addEventListener(
"click",
function(){
fileInput.click();
}
);


fileInput.addEventListener(
"change",
function(){

if(
fileInput.files &&
fileInput.files[0]
){

selectFile(
fileInput.files[0]
);

}

}
);


function selectFile(file){

selectedFile=null;

resultUrl="";

hideStatus();

result.style.display=
"none";

saveBtn.style.display=
"none";

if(!file){
return;
}


if(
file.type!=="image/jpeg" &&
file.type!=="image/jpg" &&
file.type!=="image/png"
){

showError(
"Format foto harus JPG, JPEG atau PNG."
);

return;
}


if(
file.size >
10*1024*1024
){

showError(
"Ukuran foto maksimal 10 MB."
);

return;
}


selectedFile=file;


const reader=
new FileReader();


reader.onload=
function(){

previewImg.src=
reader.result;

preview.style.display=
"block";

};


reader.readAsDataURL(file);


fileInfo.textContent=
file.name+
" • "+
formatSize(file.size);


processBtn.disabled=
false;

}


function formatSize(size){

if(
size <
1024
){

return size+
" B";

}

if(
size <
1024*1024
){

return (
size/1024
).toFixed(1)+
" KB";

}

return (
size/
(1024*1024)
).toFixed(2)+
" MB";

}


function showError(text){

statusBox.className=
"status show err";

statusBox.textContent=
text;

}


function showSuccess(text){

statusBox.className=
"status show ok";

statusBox.textContent=
text;

}


function hideStatus(){

statusBox.className=
"status";

statusBox.textContent=
"";

}


function loadingStart(text){

loadingText.textContent=
text;

loading.classList.add(
"show"
);

processBtn.disabled=
true;

}


function loadingStop(){

loading.classList.remove(
"show"
);

}


function makeTimeout(ms){

const controller=
new AbortController();

const timer=
setTimeout(
function(){

controller.abort();

},
ms
);

return{

signal:
controller.signal,

clear:
function(){

clearTimeout(timer);

}

};

}


/*
Upload foto ke Uguu
*/

async function uploadImage(file){

const form=
new FormData();

form.append(
"files[]",
file,
file.name
);


const timeout=
makeTimeout(
60000
);


try{

const response=
await fetch(
UPLOAD_API,
{
method:"POST",
body:form,
signal:timeout.signal,
cache:"no-store"
}
);


if(
!response.ok
){

throw new Error(
"Upload server HTTP "+
response.status
);

}


const data=
await response.json();


let uploadedUrl=
null;


/*
Format resmi Uguu:
{
  success:true,
  files:[
    {
      url:"https://..."
    }
  ]
}
*/


if(
data &&
Array.isArray(data.files)
){

for(
let i=0;
i<data.files.length;
i++
){

const item=
data.files[i];

if(
item &&
typeof item.url===
"string"
){

uploadedUrl=
item.url;

break;

}

}

}


/*
Fallback kalau server
mengembalikan struktur berbeda
*/

if(
!uploadedUrl &&
data &&
typeof data.url===
"string"
){

uploadedUrl=
data.url;

}


if(
!uploadedUrl
){

throw new Error(
"Uguu tidak mengembalikan URL gambar."
);

}


return uploadedUrl;


}catch(error){

if(
error.name===
"AbortError"
){

throw new Error(
"Upload foto terlalu lama. Coba foto yang lebih kecil."
);

}


if(
error.message===
"Failed to fetch"
){

throw new Error(
"Uploader tidak bisa diakses dari browser. Coba buka website menggunakan HTTPS."
);

}


throw error;


}finally{

timeout.clear();

}

}


/*
Kirim URL gambar ke Neoxr Remini
*/

async function processRemini(imageUrl){

const requestUrl=
REMINI_API+
"?image="+
encodeURIComponent(
imageUrl
)+
"&apikey="+
encodeURIComponent(
API_KEY
);


const timeout=
makeTimeout(
120000
);


try{

const response=
await fetch(
requestUrl,
{
method:"GET",
cache:"no-store",
signal:timeout.signal
}
);


if(
!response.ok
){

throw new Error(
"Remini HTTP "+
response.status
);

}


const data=
await response.json();


if(
!data ||
data.status!==true
){

throw new Error(
"API Remini gagal memproses foto."
);

}


if(
!data.data ||
typeof data.data.url!=="string"
){

throw new Error(
"API Remini tidak mengirim URL hasil."
);

}


return data.data.url;


}catch(error){

if(
error.name===
"AbortError"
){

throw new Error(
"Proses Remini terlalu lama. Coba lagi."
);

}


if(
error.message===
"Failed to fetch"
){

throw new Error(
"API Remini tidak dapat diakses dari browser."
);

}


throw error;


}finally{

timeout.clear();

}

}


/*
Proses utama
*/

processBtn.addEventListener(
"click",
async function(){

if(!selectedFile){
return;
}


hideStatus();

result.style.display=
"none";

saveBtn.style.display=
"none";


try{


loadingStart(
"Mengupload foto..."
);


const imageUrl=
await uploadImage(
selectedFile
);


loadingStart(
"Foto sudah terupload. Memproses Remini..."
);


resultUrl=
await processRemini(
imageUrl
);


resultImg.onload=
function(){

loadingStop();

result.style.display=
"block";

saveBtn.style.display=
"block";

showSuccess(
"Berhasil! Hasil Remini sudah muncul."
);


setTimeout(
function(){

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

},
100
);

};


resultImg.onerror=
function(){

loadingStop();

processBtn.disabled=
false;

showError(
"URL hasil diterima tetapi gambar hasil tidak dapat dibuka."
);

};


resultImg.src=
resultUrl;


}catch(error){

loadingStop();

processBtn.disabled=
false;

showError(
error.message ||
"Terjadi kesalahan saat memproses foto."
);

}

}
);


/*
Simpan hasil
*/

saveBtn.addEventListener(
"click",
async function(){

if(!resultUrl){
return;
}


try{

const response=
await fetch(
resultUrl,
{
mode:"cors",
cache:"no-store"
}
);


if(
!response.ok
){

throw new Error();

}


const blob=
await response.blob();


const blobUrl=
URL.createObjectURL(
blob
);


const a=
document.createElement(
"a"
);

a.href=
blobUrl;

a.download=
"remini-result.jpg";


document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){

URL.revokeObjectURL(
blobUrl
);

},
2000
);


}catch(error){

window.open(
resultUrl,
"_blank"
);

}

}
);


/*
Reset
*/

resetBtn.addEventListener(
"click",
function(){

selectedFile=null;

resultUrl="";

fileInput.value="";

preview.style.display=
"none";

result.style.display=
"none";

saveBtn.style.display=
"none";

processBtn.disabled=
true;

hideStatus();

window.scrollTo(
{
top:0,
behavior:"smooth"
}
);

}
);

</script>

</body>
</html>
